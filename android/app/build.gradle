plugins {
    id 'com.android.application'
}

android {
    namespace 'com.q.claudebridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.q.claudebridge"
        minSdk 26
        targetSdk 34
        // D-25.2: первая сборка форка
        versionCode 2
        versionName "0.2.0"
    }

    // P-8: release подписывается ключом команды. Ключ и пароль — только вне репозитория:
    // свойства Gradle cbReleaseStoreFile / cbReleaseKeyAlias / cbReleaseStorePassword /
    // cbReleaseKeyPassword (tools/release.ps1 передаёт их через ORG_GRADLE_PROJECT_*).
    // Без них release собирается неподписанным (app-release-unsigned.apk).
    signingConfigs {
        if (project.hasProperty('cbReleaseStoreFile')) {
            release {
                storeFile file(project.property('cbReleaseStoreFile'))
                storePassword project.findProperty('cbReleaseStorePassword')
                keyAlias project.findProperty('cbReleaseKeyAlias')
                keyPassword project.findProperty('cbReleaseKeyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false // M-5: явно, независимо от умолчаний AGP
            if (project.hasProperty('cbReleaseStoreFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // claude-tunnel (iroh p2p) лежит в jniLibs как libclaudetunnel.so и
    // запускается как процесс: для exec библиотека должна быть распакована
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    // JVM-тесты чистой логики (Protocol): org.json из android.jar в unit-тестах — заглушки (D-15.8)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// Web-интерфейс вкладывается в APK и отдаётся локальным шлюзом:
// интерфейс приложения живёт даже при выключенном ПК.
tasks.register('syncWebAssets', Copy) {
    from '../../bridge/web'
    into 'src/main/assets/web'
}
tasks.register('syncVendorAssets', Copy) {
    from '../../bridge/node_modules/@xterm/xterm/lib/xterm.js',
         '../../bridge/node_modules/@xterm/xterm/css/xterm.css',
         '../../bridge/node_modules/@xterm/addon-fit/lib/addon-fit.js'
    into 'src/main/assets/web/vendor'
}
preBuild.dependsOn 'syncWebAssets', 'syncVendorAssets'
